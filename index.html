<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章查询</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #333333;
            --sub: #888888;
            --border: #e0e0e0;
            --accent: #333333;
            --accent-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --card: #2a2a2a;
            --text: #e0e0e0;
            --sub: #999999;
            --border: #3a3a3a;
            --accent: #e0e0e0;
            --accent-text: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 16px;
            transition: background 0.2s, color 0.2s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text);
        }

        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        #searchInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--card);
            color: var(--text);
            outline: none;
            -webkit-appearance: none;
        }

        #searchInput:focus {
            border-color: var(--text);
        }

        #searchBtn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 1rem;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        #searchBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            font-size: 0.85rem;
            color: var(--sub);
            margin-bottom: 8px;
        }

        #result {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .count {
            font-size: 0.85rem;
            color: var(--sub);
            margin-bottom: 8px;
        }

        .file-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .file-header {
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .file-header:hover {
            background: rgba(0,0,0,0.03);
        }

        [data-theme="dark"] .file-header:hover {
            background: rgba(255,255,255,0.03);
        }

        .file-header .name {
            font-size: 0.95rem;
        }

        .file-header .arrow {
            font-size: 0.8rem;
            color: var(--sub);
            transition: transform 0.2s;
        }

        .file-header.open .arrow {
            transform: rotate(90deg);
        }

        .file-content {
            display: none;
            padding: 0 14px 14px;
            border-top: 1px solid var(--border);
        }

        .file-content.show {
            display: block;
        }

        .file-content pre {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: var(--accent);
            color: var(--accent-text);
        }

        .empty {
            text-align: center;
            color: var(--sub);
            padding: 40px 0;
            font-size: 0.95rem;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .search-row { flex-direction: column; }
            #searchBtn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>TXT搜索</h2>
            <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
        </div>
        
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="输入关键词搜索文件名…" onkeydown="if(event.key==='Enter')searchFiles()">
            <button id="searchBtn" onclick="searchFiles()">搜索</button>
        </div>
        
        <div class="loading" id="loading"></div>
        <div class="count" id="count"></div>
        <div id="result">
            <div class="empty">正在加载文件列表…</div>
        </div>
    </div>
    
    <script>
        // ===== 数据缓存 =====
        let fileCache = [];
        let isSearching = false;
        let searchTimer = null;

        // ===== 主题：默认深色，不存储 =====
        document.documentElement.setAttribute('data-theme', 'dark');
        const themeBtn = document.querySelector('.theme-toggle');

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️';
            }
        }

        // ===== 渲染文件列表（核心函数，搜索和初始化共用）=====
        function renderFiles(filterKw) {
            const resultDom = document.getElementById('result');
            const countDom = document.getElementById('count');

            resultDom.innerHTML = '';
            countDom.textContent = '';

            let found = 0;

            for (const file of fileCache) {
                // 无关键词 → 显示全部；有关键词 → 按文件名过滤
                if (!filterKw || file.name.toLowerCase().includes(filterKw)) {
                    found++;
                    const id = 'file-' + found;
                    const safeName = escapeHtml(file.name);

                    resultDom.innerHTML += `
                        <div class="file-item">
                            <div class="file-header" onclick="toggleContent('${id}')">
                                <span class="name">📄 ${safeName}</span>
                                <span class="arrow">▶</span>
                            </div>
                            <div class="file-content" id="${id}">
                                <pre>${escapeHtml(file.content)}</pre>
                                <button class="download-btn" onclick="downloadFile('${file.name.replace(/'/g, "\\'")}')">
                                    ⬇️ 下载文件
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            if (filterKw) {
                countDom.textContent = found > 0 ? `找到 ${found} 个文件` : '没有匹配结果';
                if (found === 0) {
                    resultDom.innerHTML = '<div class="empty">没有匹配结果</div>';
                }
            } else {
                countDom.textContent = `共 ${found} 个文件`;
            }
        }

        // ===== 初始化 =====
        async function init() {
            const loadingDom = document.getElementById('loading');
            const resultDom = document.getElementById('result');

            try {
                loadingDom.textContent = '正在读取文件列表…';

                const listResp = await fetch('./files.txt');
                if (!listResp.ok) throw new Error('files.txt 不存在');
                const listText = await listResp.text();
                const fileNames = listText.split('\n')
                    .map(s => s.trim())
                    .filter(s => s && s.endsWith('.txt'));

                loadingDom.textContent = `正在加载 ${fileNames.length} 个文件…`;

                const results = await Promise.allSettled(
                    fileNames.map(async (name) => {
                        const resp = await fetch('./' + name);
                        if (!resp.ok) throw new Error('读取失败');
                        const content = await resp.text();
                        return { name, content };
                    })
                );

                fileCache = results
                    .filter(r => r.status === 'fulfilled')
                    .map(r => r.value);

                loadingDom.textContent = '';

                // ✅ 加载完成后直接渲染全部文件
                renderFiles(null);
            } catch (e) {
                loadingDom.textContent = '';
                resultDom.innerHTML = '<div class="empty">初始化失败，请确认 files.txt 存在</div>';
                console.error(e);
            }
        }

        // ===== 搜索 =====
        function searchFiles() {
            const btn = document.getElementById('searchBtn');
            const input = document.getElementById('searchInput');

            if (isSearching) return;

            const kw = input.value.trim().toLowerCase();

            if (searchTimer) clearTimeout(searchTimer);

            // 空关键词 → 显示全部
            if (!kw) {
                renderFiles(null);
                return;
            }

            btn.disabled = true;
            isSearching = true;
            btn.textContent = '搜索中…';

            searchTimer = setTimeout(() => {
                renderFiles(kw);

                isSearching = false;
                btn.disabled = false;
                btn.textContent = '搜索';
            }, 300);
        }

        // ===== 下载功能 =====
        function downloadFile(fileName) {
            const file = fileCache.find(f => f.name === fileName);
            if (!file) {
                alert('文件未找到：' + fileName);
                return;
            }

            const blob = new Blob([file.content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function toggleContent(id) {
            const content = document.getElementById(id);
            const header = content.parentElement.querySelector('.file-header');
            content.classList.toggle('show');
            header.classList.toggle('open');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        init();
    </script>
</body>
</html>
